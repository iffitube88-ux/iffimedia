<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IffiMedia | Premium Digital Media Agency & Organic SEO Growth</title>
    <meta name="description" content="IffiMedia is a premium digital media agency specializing in organic SEO, video production, content strategy, and brand storytelling. We scale digital brands through data-driven strategies and modern content media." />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://www.iffimedia.com/" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IffiMedia | Premium Digital Media Agency & Organic SEO Growth" />
    <meta property="og:description" content="IffiMedia is a premium digital media agency specializing in organic SEO, video production, content strategy, and brand storytelling. We scale digital brands through data-driven strategies." />
    <meta property="og:url" content="https://www.iffimedia.com/" />
    <meta property="og:site_name" content="IffiMedia" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IffiMedia | Premium Digital Media Agency & Organic SEO Growth" />
    <meta name="twitter:description" content="IffiMedia is a premium digital media agency specializing in organic SEO, video production, content strategy, and brand storytelling." />
    <meta name="twitter:site" content="iffimedia" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    
    <!-- Defer font loading for better performance -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>
    
    <style>
      html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
      body { background-color: #0a0a0b; color: #ffffff; }
      #root { min-height: 100vh; }
    </style>
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "IffiMedia",
      "alternateName": "IFFI Media",
      "url": "https://www.iffimedia.com",
      "logo": "https://www.iffimedia.com/favicon.svg",
      "description": "IffiMedia is a premium digital media agency specializing in organic SEO, video production, content strategy, podcast management, and brand storytelling.",
      "foundingDate": "2024",
      "slogan": "Turn Digital Attention Into Measurable Growth",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+971-50-709-1227",
        "contactType": "customer service",
        "email": "hello@iffimedia.com",
        "areaServed": "AE",
        "availableLanguage": ["English", "Arabic"]
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Dubai",
        "addressRegion": "Dubai",
        "addressCountry": "AE"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "25.2048",
        "longitude": "55.2708"
      },
      "sameAs": [
        "https://facebook.com/iffimedia",
        "https://twitter.com/iffimedia",
        "https://linkedin.com/company/iffimedia",
        "https://instagram.com/iffimedia",
        "https://youtube.com/@iffimedia"
      ]
    }
    </script>

    <!-- Structured Data - Professional Services -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "IffiMedia",
      "description": "Premium digital media agency offering organic SEO, video production, content strategy, podcast management, and brand storytelling services.",
      "url": "https://www.iffimedia.com",
      "telephone": "+971507091227",
      "email": "hello@iffimedia.com",
      "areaServed": {
        "@type": "Country",
        "name": "United Arab Emirates"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Digital Media & Marketing Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Organic SEO & Content Strategy",
              "description": "Data-driven SEO strategies including technical optimization, content marketing, and authority building for sustainable organic growth"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Video Production & Repurposing",
              "description": "Professional video content creation and strategic repurposing across platforms to maximize reach and engagement"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Corporate Podcast Management",
              "description": "End-to-end podcast production and management to establish thought leadership and build authentic audience connections"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Brand Storytelling & PR",
              "description": "Compelling brand narratives and strategic PR campaigns that build credibility and drive meaningful engagement"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Google Ads Management",
              "description": "Expert Google Ads campaign management including search ads, shopping ads, display ads, and Performance Max optimization"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Meta Advertising",
              "description": "Facebook and Instagram advertising campaigns with advanced targeting, creative development, and optimization"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Conversion Rate Optimization",
              "description": "Data-driven CRO strategies to improve landing pages, user experience, and increase conversion rates"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Digital Growth Strategy",
              "description": "Comprehensive digital strategy that aligns all channels and tactics to achieve business objectives and drive measurable growth"
            }
          }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
